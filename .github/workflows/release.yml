name: "Publish Zola Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-zola:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- STEP 1: COMPATIBILITY & DEPENDENCIES ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './zola-frontend/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpkgconf-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2t64 jq

      # --- STEP 2: BUILD PYTHON DAEMON BINARY ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './zola-backend/requirements.txt'

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-models-${{ hashFiles('zola-backend/config.py') }}
          restore-keys: |
            huggingface-models-

      - name: Freeze Python Daemon with PyInstaller
        run: |
          cd zola-backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pip-audit bandit pyflakes
          pip-audit -r requirements.txt
          bandit -r . -x .venv,profile_backend.py -q
          pyflakes *.py
          pyinstaller zola-daemon.spec
          test -f dist/zola-daemon
          chmod +x dist/zola-daemon

      # --- STEP 3: SYNC FRONTEND VERSION & BUILD TAURI APPIMAGE ---
      - name: Sync Frontend Version with Tag and Install Dependencies
        run: |
          cd zola-frontend
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building Zola release version: $VERSION"
          # Sync tauri.conf.json version with release tag
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          # Sync package.json version
          npm version "$VERSION" --no-git-tag-version --allow-same-version || true
          # Sync Cargo.toml version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml || true
          npm install

      - name: Build Tauri Frontend AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zola Release ${{ github.ref_name }}"
          releaseBody: "Automated production build of Zola Voice Terminal and Daemon Core."
          releaseDraft: false
          prerelease: false
          projectPath: "./zola-frontend"

      # --- STEP 4: GENERATE CHECKSUMS AND ATTACH DAEMON + CHECKSUMS ---
      - name: Prepare Assets and Generate Checksums
        run: |
          mkdir -p release-dist
          cp zola-backend/dist/zola-daemon release-dist/
          
          # Find and copy all built Tauri bundles (AppImage, deb, rpm)
          find zola-frontend/src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release-dist/ \;
          
          cd release-dist
          echo "=== Release Artifacts to Checksum ==="
          ls -la
          
          # Generate SHA-256 checksums file
          sha256sum * > checksums.txt
          echo "=== Generated Checksums ==="
          cat checksums.txt

      - name: Upload Compiled Daemon Binary and Checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/zola-daemon
            release-dist/checksums.txt
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
