name: "Publish Zola Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-zola:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # --- STEP 1: COMPATIBILITY & DEPENDENCIES ---
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './zola-frontend/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpkgconf-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2t64 jq libportaudio2

      # --- STEP 2: BUILD PYTHON DAEMON BINARY ---
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './zola-backend/requirements.lock'

      - name: Cache HuggingFace Models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-models-${{ hashFiles('zola-backend/config.py') }}
          restore-keys: |
            huggingface-models-

      - name: Freeze Python Daemon with PyInstaller
        run: |
          cd zola-backend
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install pyinstaller pip-audit bandit pyflakes
          pip-audit -r requirements.lock
          bandit -r . -x .venv,profile_backend.py -q
          pyflakes *.py
          # Regression suite (config, API security, history, model downloads);
          # the other tests/ scripts need a live daemon, a mic or model downloads
          (cd .. && python -m unittest tests.test_regressions)
          pyinstaller zola-daemon.spec
          test -f dist/zola-daemon
          chmod +x dist/zola-daemon

      # --- STEP 3: SYNC FRONTEND VERSION & BUILD TAURI APPIMAGE ---
      - name: Sync Frontend Version with Tag and Install Dependencies
        run: |
          cd zola-frontend
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building Zola release version: $VERSION"
          # Sync tauri.conf.json version with release tag
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          # Sync package.json version
          npm version "$VERSION" --no-git-tag-version --allow-same-version || true
          # Sync Cargo.toml version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml || true
          npm install

      # The rpm, deb and AppImage ship the daemon as a Tauri sidecar
      # (bundle.externalBin), which Tauri expects under its target triple.
      - name: Bundle the Daemon into the App
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p zola-frontend/src-tauri/binaries
          cp zola-backend/dist/zola-daemon "zola-frontend/src-tauri/binaries/zola-daemon-$TRIPLE"

      - name: Build Tauri App Bundles (frontend + daemon)
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zola Release ${{ github.ref_name }}"
          releaseBody: "Automated production build of Zola. The .rpm, .deb and .AppImage each contain the app and its speech daemon; the separate zola-daemon file is only used by install.sh (AppImage + systemd setup)."
          releaseDraft: false
          prerelease: false
          projectPath: "./zola-frontend"

      # --- STEP 4: GENERATE CHECKSUMS AND ATTACH DAEMON + CHECKSUMS ---
      - name: Prepare Assets and Generate Checksums
        run: |
          mkdir -p release-dist
          cp zola-backend/dist/zola-daemon release-dist/
          
          # Find and copy all built Tauri bundles (AppImage, deb, rpm)
          find zola-frontend/src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release-dist/ \;
          
          cd release-dist
          echo "=== Release Artifacts to Checksum ==="
          ls -la
          
          # Generate SHA-256 checksums file
          sha256sum * > checksums.txt
          echo "=== Generated Checksums ==="
          cat checksums.txt

      # Standalone daemon for install.sh, which runs it as a systemd user service
      - name: Upload Compiled Daemon Binary and Checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.0
        with:
          files: |
            release-dist/zola-daemon
            release-dist/checksums.txt
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
